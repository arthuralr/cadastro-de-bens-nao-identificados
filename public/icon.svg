<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff8e8e" />
      <stop offset="100%" stop-color="#e85a5a" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1f2937" flood-opacity="0.25" />
    </filter>
  </defs>
  <!-- Background with safe padding for maskable -->
  <rect width="512" height="512" rx="112" fill="#1f2937" />
  
  <!-- Outer accent circle -->
  <circle cx="256" cy="256" r="190" fill="url(#grad)" filter="url(#shadow)" />
  
  <!-- Inner box icon -->
  <g fill="none" stroke="#ffffff" stroke-width="24" stroke-linecap="round" stroke-linejoin="round">
    <!-- Box outline -->
    <path d="M160 210 L256 150 L352 210 L352 330 L256 390 L160 330 Z" />
    <!-- Center seam -->
    <path d="M256 150 L256 390" />
    <!-- Flaps -->
    <path d="M160 210 L256 270 L352 210" />
    <!-- Barcode / Plaqueta emblem on left flap -->
    <line x1="190" y1="260" x2="225" y2="282" stroke="#1f2937" stroke-width="14" />
    <line x1="202" y1="250" x2="237" y2="272" stroke="#1f2937" stroke-width="8" />
  </g>
  <!-- Checkmark / Search badge in bottom right -->
  <circle cx="340" cy="340" r="54" fill="#1f2937" stroke="#ffffff" stroke-width="12" />
  <path d="M320 340 L334 354 L362 326" fill="none" stroke="#ff7a7a" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />
</svg>
